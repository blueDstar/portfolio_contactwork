    <text x="80" y="818" font-size="22" font-family="Consolas, Liberation Mono, monospace" fill="#A5A5A5">NGUYỄN VĂN ĐẠT / ROBOTICS R&amp;D</text>
    <text x="1365" y="818" text-anchor="end" font-size="27">Khám phá dự án</text>
