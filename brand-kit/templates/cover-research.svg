    <path d="M80 175H1520" stroke="#303030"/>
    <text x="80" y="275" font-size="22" font-family="Consolas, Liberation Mono, monospace" fill="#A5A5A5" letter-spacing="1.5">INSIDE THE SYSTEM</text>
