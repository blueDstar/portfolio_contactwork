<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">blueDStar / Research cover template</title>
  <desc id="desc">Khung ngang 16:9 cho bìa nghiên cứu. Thay vùng tư liệu và tiêu đề theo bài viết hoặc video.</desc>
  <rect width="1600" height="900" fill="#0B0B0B"/>
